# Optional: paste this into GitHub → Actions → New workflow
# (browser UI works even when your PAT lacks the `workflow` git scope)
#
# Or skip Actions and deploy locally from the client folder:
#   cp .env.ftp.local.example .env.ftp.local   # fill FTP_* values
#   npm run build && npm run deploy:ftp

name: Deploy Vite frontend (FTP)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-vite.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mediumpurple-chicken-145151.hostingersite.com

      - name: Deploy dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./client/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR != '' && secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
